
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020307">
<title>AETHER AI</title>

<style>
*{box-sizing:border-box}
:root{--cyan:#67dfff;--blue:#168cff}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
 background:#000;
 color:#f7f8fc;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input{font:inherit}
.app{
 position:relative;
 width:100%;
 height:100dvh;
 overflow:hidden;
 background:
 radial-gradient(ellipse 95% 34% at 50% 100%,#9bcaff 0%,#398fe9 28%,#0755a5 55%,#001a3d 78%,transparent 100%),
 #020307;
}
.app:before{
 content:"";
 position:absolute;
 inset:0;
 pointer-events:none;
 background:linear-gradient(to bottom,transparent 48%,#020307 62%,transparent 100%);
 opacity:.45;
}
.topbar{
 position:absolute;top:0;left:0;right:0;
 height:65px;padding:0 25px;
 display:flex;align-items:center;justify-content:space-between;
 z-index:5;
}
.brand{
 font-size:13px;letter-spacing:5px;font-weight:700;
 color:#d9e9fa;opacity:.85;
}
.menu{
 width:40px;height:40px;border-radius:50%;
 border:1px solid #ffffff25;background:#ffffff0a;
 color:white;font-size:19px;
 backdrop-filter:blur(15px);
}
.core{
 position:absolute;
 top:12%;
 left:50%;
 transform:translateX(-50%);
 width:190px;height:190px;
 display:grid;place-items:center;
}
.orb{
 width:160px;height:160px;border-radius:50%;
 position:relative;
 background:
 radial-gradient(ellipse at 32% 25%,#07152d 0%,#020918 48%,#01040c 75%);
 box-shadow:0 0 45px #087dff45,0 0 105px #0077ff35,
 inset -12px -8px 28px #087fff30;
 animation:float 6s ease-in-out infinite;
}
.orb:before{
 content:"";position:absolute;inset:-1px;
 border-radius:50%;
 border:2px solid transparent;
 border-top-color:#a6f4ff;
 border-right-color:#37baff;
 border-bottom-color:#174fff;
 transform:rotate(-35deg) scale(1.02);
 filter:drop-shadow(0 0 8px #28aaff);
}
.orb:after{
 content:"";position:absolute;
 inset:12px -3px;border-radius:50%;
 border:2px solid transparent;
 border-bottom-color:#4e9cff;
 border-left-color:#174dff;
 transform:rotate(35deg);
 filter:drop-shadow(0 0 8px #168cff);
}
.orb-glow{
 position:absolute;inset:0;border-radius:50%;
 background:radial-gradient(ellipse at 70% 55%,#008dff35,transparent 60%);
}
@keyframes float{
 0%,100%{translate:0 0;scale:1}
 50%{translate:0 -9px;scale:1.025}
}
.welcome{
 position:absolute;top:47%;
 left:50%;transform:translate(-50%,-50%);
 width:90%;text-align:center;z-index:2;
 transition:opacity .3s;
}
.greeting{
 color:#a5a8b0;font-size:20px;font-weight:400;
 margin-bottom:23px;
}
h1{
 font-size:clamp(37px,5.5vw,55px);
 line-height:1.15;letter-spacing:-2.2px;
 font-weight:650;margin:0;
}
.composer-area{
 position:absolute;bottom:5.5%;
 left:50%;transform:translateX(-50%);
 width:min(575px,88%);z-index:4;
}
.composer{
 min-height:77px;
 display:flex;align-items:center;
 padding:10px 18px 10px 25px;
 border:1px solid #c9e8ff65;
 border-radius:60px;
 background:linear-gradient(110deg,#ffffff18,#ffffff0b);
 backdrop-filter:blur(24px);
 -webkit-backdrop-filter:blur(24px);
 box-shadow:0 0 35px #5db8ff25,inset 0 1px 1px #ffffff35;
 transition:.25s;
}
.composer:focus-within{
 border-color:#a6e8ff;
 box-shadow:0 0 45px #5db8ff45,inset 0 1px 1px #ffffff55;
}
#prompt{
 flex:1;min-width:0;
 color:white;background:transparent;border:0;outline:0;
 font-size:19px;font-weight:450;
}
#prompt::placeholder{color:#f0f5ff;opacity:.95}
.voice,.send{
 border:0;background:transparent;color:white;
 display:grid;place-items:center;
 width:42px;height:45px;flex-shrink:0;
}
.voice svg{width:31px;height:31px}
.send{
 display:none;border-radius:50%;
 background:#d8f4ff;color:#061322;
 font-size:22px;font-weight:700;
}
.chat{
 position:absolute;top:15%;bottom:155px;
 left:50%;transform:translateX(-50%);
 width:min(700px,88%);
 overflow-y:auto;padding:15px 5px;
 z-index:3;display:none;
 scrollbar-width:thin;
}
.chat.active{display:block}
.msg{
 padding:15px 19px;margin:14px 0;
 border-radius:19px;line-height:1.65;
 font-size:15px;white-space:pre-wrap;
}
.user{
 margin-left:auto;max-width:82%;
 background:#173b5d;border:1px solid #6cbfff40;
}
.ai{max-width:95%;color:#e7edf7}
.menu-panel{
 display:none;position:absolute;z-index:10;
 top:65px;right:18px;width:220px;
 padding:9px;border-radius:17px;
 border:1px solid #ffffff25;
 background:#101722ed;
 backdrop-filter:blur(25px);
 box-shadow:0 15px 45px #0009;
}
.menu-panel.open{display:block}
.menu-panel button{
 width:100%;padding:13px;border:0;
 border-radius:10px;text-align:left;
 background:transparent;color:#eaf3ff;
}
.menu-panel button:hover{background:#ffffff12}
.extra{
 display:none;position:absolute;bottom:100px;
 left:0;right:0;text-align:center;
 color:#e4f4ff;font-size:12px;
}
.extra button{
 background:#ffffff12;color:white;
 border:1px solid #ffffff25;
 border-radius:20px;padding:8px 13px;margin:4px;
}
@media(max-width:600px){
 .topbar{padding:0 18px}
 .core{top:14%;scale:.9}
 .welcome{top:48%}
 h1{font-size:clamp(36px,10vw,46px);letter-spacing:-1.7px}
 .greeting{font-size:18px}
 .composer-area{width:90%;bottom:5%}
 .composer{min-height:69px;padding-left:20px}
 #prompt{font-size:17px}
}
</style>
</head>

<body>
<div class="app" id="app">

 <header class="topbar">
  <div class="brand">AETHER</div>
  <button class="menu" onclick="toggleMenu()" aria-label="Menu">☰</button>
 </header>

 <div class="menu-panel" id="menuPanel">
  <button onclick="newChat()">＋ New chat</button>
  <button onclick="showFeature('Projects')">Projects</button>
  <button onclick="showFeature('Image Studio')">Image Studio</button>
  <button onclick="showFeature('Website Builder')">Website Builder</button>
  <button onclick="showFeature('Video Studio · Pro')">Video Studio · Pro</button>
  <button onclick="showFeature('Settings')">Settings</button>
 </div>

 <div class="core">
  <div class="orb"><div class="orb-glow"></div></div>
 </div>

 <section class="welcome" id="welcome">
  <div class="greeting">Hello, AETHER User</div>
  <h1>How can I help<br>you today?</h1>
 </section>

 <section class="chat" id="chat"></section>

 <div class="composer-area">
  <div class="extra" id="extra">
   <button onclick="showFeature('Upload file')">＋ Upload file</button>
   <button onclick="showFeature('Deep Think')">Deep Think</button>
   <button onclick="showFeature('Web Search')">Web Search</button>
  </div>
  <div class="composer">
   <button class="voice" id="plus" onclick="toggleExtra()" aria-label="More tools">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
     <path d="M12 5v14M5 12h14"/>
    </svg>
   </button>
   <input id="prompt" placeholder="Ask anything..." autocomplete="off">
   <button class="voice" id="mic" onclick="voiceInput()" aria-label="Voice input">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
     <path d="M3 13v6M8 8v16M13 4v24M18 10v12M23 7v18M28 13v6"/>
    </svg>
   </button>
   <button class="send" id="send" onclick="sendMessage()" aria-label="Send">↑</button>
  </div>
 </div>
</div>

<script>
const promptInput=document.getElementById('prompt');
const chat=document.getElementById('chat');
const welcome=document.getElementById('welcome');
const mic=document.getElementById('mic');
const send=document.getElementById('send');
let messages=[];

promptInput.addEventListener('input',()=>{
 const hasText=promptInput.value.trim().length>0;
 mic.style.display=hasText?'none':'grid';
 send.style.display=hasText?'grid':'none';
});
promptInput.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!e.shiftKey){
  e.preventDefault();sendMessage();
 }
});
function sendMessage(){
 const value=promptInput.value.trim();
 if(!value)return;
 welcome.style.display='none';
 chat.classList.add('active');
 addMessage(value,'user');
 promptInput.value='';
 mic.style.display='grid';send.style.display='none';
 setTimeout(()=>{
  addMessage("Welcome to AETHER. Your message has been received. Connect an AI model through a secure backend to enable real AI responses.",'ai');
 },450);
}
function addMessage(text,type){
 const div=document.createElement('div');
 div.className='msg '+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 messages.push({text,type});
}
function newChat(){
 messages=[];chat.innerHTML='';
 chat.classList.remove('active');
 welcome.style.display='block';
 promptInput.value='';
 mic.style.display='grid';send.style.display='none';
 toggleMenu();
}
function toggleMenu(){
 document.getElementById('menuPanel').classList.toggle('open');
}
function toggleExtra(){
 const el=document.getElementById('extra');
 el.style.display=el.style.display==='block'?'none':'block';
}
function showFeature(name){
 document.getElementById('menuPanel').classList.remove('open');
 document.getElementById('extra').style.display='none';
 alert(name+' — This feature will be connected in the next AETHER update.');
}
function voiceInput(){
 const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Speech){alert('Voice input is not supported in this browser.');return;}
 const recognition=new Speech();
 recognition.lang='en-US';
 recognition.onresult=e=>{
  promptInput.value=e.results[0][0].transcript;
  promptInput.dispatchEvent(new Event('input'));
 };
 recognition.start();
}
</script>
</body>
</html>
